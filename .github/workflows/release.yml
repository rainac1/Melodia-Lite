name: Release

# 仅手动触发（push tag 触发已关闭）：在 Actions → Release → Run workflow 输入版本号，
# 构建正式签名 APK 并作为 artifact 留存，不创建 GitHub Release。
# 版本号支持 v1.2.3 与 v1.2.3-powersaving.1（任意 kind.N 后缀）两种形式。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 2.1.1 或 2.1.1-powersaving.1（不带 v）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 版本号只解析一次，构建与发布共用
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      # 校验 tag 所在分支需要完整历史与远端分支
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 从 tag 解析版本号
        id: version
        env:
          DRY_RUN_VERSION: ${{ github.event.inputs.version }}
        run: |
          TAG_NAME=${DRY_RUN_VERSION:-${GITHUB_REF_NAME#v}}
          BASE_VERSION=${TAG_NAME%%-*}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "tag 格式不是 vMAJOR.MINOR.PATCH[-kind.N]：$TAG_NAME" >&2
            exit 1
          fi

          # 带后缀的 tag（v1.2.3-powersaving.1 这种）一律算预发布：kind 任意、只要是小写单词，
          # 末尾编号写进 versionCode 末两位；正式版固定占 99，所以编号须 < 99 才不会和正式版撞码
          if [ "$TAG_NAME" = "$BASE_VERSION" ]; then
            PRERELEASE=false
            SUB_CODE=99
          else
            PRERELEASE=true
            SUFFIX=${TAG_NAME#"$BASE_VERSION"-}
            if ! [[ "$SUFFIX" =~ ^[a-z][a-z0-9-]*\.[0-9]+$ ]]; then
              echo "后缀需要形如 -powersaving.1（小写单词 + 点 + 编号）：$SUFFIX" >&2
              exit 1
            fi
            NUM=${SUFFIX##*.}
            if [ "$NUM" -gt 98 ]; then
              echo "后缀编号需在 0~98 之间（99 留给正式版）：$NUM" >&2
              exit 1
            fi
            SUB_CODE=$NUM
          fi

          VERSION_CODE=$(( (MAJOR * 10000 + MINOR * 100 + PATCH) * 100 + SUB_CODE ))
          echo "name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      # 手动演练没有 tag，按所选分支构建，不做校验
      - name: 校验 tag 所在分支
        if: github.event_name == 'push'
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            BRANCH=dev
          else
            BRANCH=main
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCH"; then
            echo "tag $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 $BRANCH 分支上，预发布需打在 dev、正式版需打在 main" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME 位于 $BRANCH 分支"

  android:
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # keystore（melodia-release.jks，别名与密码均为 android）已随仓库提交，
      # build.gradle.kts 会直接用它做正式签名，不再依赖任何 secret
      - name: Release 构建（正式签名）
        run: |
          ./gradlew :app:assembleRelease \
            -PreleaseVersionName=${{ needs.version.outputs.name }} \
            -PreleaseVersionCode=${{ needs.version.outputs.code }} \
            --no-daemon

      # 内置 keystore 缺失时 build.gradle.kts 会静默退回 debug 签名，这里硬校验兜底
      - name: 校验正式签名生效
        run: |
          APK=app/build/outputs/apk/release/Melodia-v${{ needs.version.outputs.name }}-release.apk
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 1 -type d | sort -V | tail -1)/apksigner
          DN=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate DN')
          echo "$DN"
          if echo "$DN" | grep -qi "Android Debug"; then
            echo "检测到 debug 签名，说明内置 melodia-release.jks 未生效，已终止发布" >&2
            exit 1
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/build/outputs/apk/release/Melodia-v${{ needs.version.outputs.name }}-release.apk
          retention-days: 7

  publish:
    needs: [version, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # 生成分类日志需要完整提交历史和全部 tag，checkout 默认浅克隆（depth=1）拿不到
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 按 commit message 的 conventional commits 前缀（feat/fix/refactor...）自己分类生成
      - name: 生成分类日志
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="HEAD"
          [ -n "$PREV_TAG" ] && RANGE="$PREV_TAG..HEAD"

          declare -A TITLES=(
            [feat]="✨ 新功能" [fix]="🐛 修复" [refactor]="♻️ 重构"
            [perf]="⚡ 性能" [docs]="📝 文档" [test]="✅ 测试"
            [build]="📦 构建" [ci]="🔧 CI" [chore]="🧹 杂项" [style]="🎨 样式"
          )
          ORDER=(feat fix refactor perf build docs test ci chore style)
          declare -A BUCKETS
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            TYPE=$(echo "$line" | grep -oE '^[a-z]+' || true)
            if [ -n "$TYPE" ] && [ -n "${TITLES[$TYPE]:-}" ]; then
              BUCKETS[$TYPE]="${BUCKETS[$TYPE]:-}"$'\n'"- $line"
            else
              OTHER="$OTHER"$'\n'"- $line"
            fi
          done < <(git log "$RANGE" --no-merges --pretty=format:'%s')

          {
            for t in "${ORDER[@]}"; do
              if [ -n "${BUCKETS[$t]:-}" ]; then
                echo "### ${TITLES[$t]}"
                echo "${BUCKETS[$t]}"
                echo ""
              fi
            done
            if [ -n "$OTHER" ]; then
              echo "### 📌 其他"
              echo "$OTHER"
              echo ""
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: release-notes.md
          prerelease: ${{ needs.version.outputs.prerelease }}
          files: dist/*
